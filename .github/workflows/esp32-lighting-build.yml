name: ESP32 lighting build

on:
  push:
    branches: [main]
    paths:
      - 'esp32/lighting/**'
      - 'protocol/**'
      - 'library/**'
      - '.github/workflows/esp32-lighting-build.yml'
  pull_request:
    paths:
      - 'esp32/lighting/**'
      - 'protocol/**'
      - 'library/**'
      - '.github/workflows/esp32-lighting-build.yml'

jobs:
  platformio:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install PlatformIO
        run: python -m pip install --upgrade platformio

      - name: Build lighting firmware
        run: pio run -d esp32/lighting
