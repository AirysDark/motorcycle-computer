[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200

build_flags =
  -I../../protocol/include
  -I../../library/include

build_src_filter =
  +<*>
  +<../../../protocol/src/codec.cpp>
  +<../../../library/src/stream_parser.cpp>
  +<../../../library/src/router.cpp>
  +<../../../library/src/northbridge.cpp>
